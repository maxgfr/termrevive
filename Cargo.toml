[package]
name = "termrevive"
version = "1.3.0"
edition = "2024"
description = "Save and restore terminal sessions (Ghostty, iTerm2, kitty, Terminal.app): windows, tabs, splits and running programs, across reboots"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# The released binary: whole-program optimization and no symbol table make it a
# third smaller (2.3 MB to 1.5 MB on arm64), for a clean build of about 40 s
# instead of 10.
[profile.release]
lto = true
codegen-units = 1
strip = true
