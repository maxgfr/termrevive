[package]
name = "termrevive"
version = "1.0.0"
edition = "2024"
description = "Save and restore terminal sessions (windows, tabs, splits, running programs) across reboots"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
